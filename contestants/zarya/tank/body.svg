<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>ЗАРЯ — корпус</title>
  <defs>
    <linearGradient id="za-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d3778"/>
      <stop offset="0.5" stop-color="#2e2050"/>
      <stop offset="1" stop-color="#4d3778"/>
    </linearGradient>
    <linearGradient id="za-track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1530"/>
      <stop offset="1" stop-color="#0d0a18"/>
    </linearGradient>
    <linearGradient id="za-prow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e2050"/>
      <stop offset="1" stop-color="#6d4fc2"/>
    </linearGradient>
  </defs>
  <!-- гусеницы -->
  <rect x="5" y="4" width="54" height="13" rx="6" fill="url(#za-track)" stroke="#07050d" stroke-width="1.2"/>
  <rect x="5" y="47" width="54" height="13" rx="6" fill="url(#za-track)" stroke="#07050d" stroke-width="1.2"/>
  <path d="M11 6v9M17 6v9M23 6v9M29 6v9M35 6v9M41 6v9M47 6v9M53 6v9M11 49v9M17 49v9M23 49v9M29 49v9M35 49v9M41 49v9M47 49v9M53 49v9" stroke="#4a3f6b" stroke-width="1.6"/>
  <!-- корпус, нос вправо -->
  <path d="M12 15 H43 Q59 18 59 32 Q59 46 43 49 H12 Q7 49 7 44 V20 Q7 15 12 15 Z" fill="url(#za-hull)" stroke="#120c22" stroke-width="1.6"/>
  <!-- носовая грань с рассветным отливом -->
  <path d="M43 15 Q59 18 59 32 Q59 46 43 49 Q50 40 50 32 Q50 24 43 15 Z" fill="url(#za-prow)"/>
  <!-- золотая кромка носа -->
  <path d="M44 15.8 Q58 19 58 32 Q58 45 44 48.2" fill="none" stroke="#ffd166" stroke-width="1.6"/>
  <!-- восход на корме: полудиск над горизонтом -->
  <path d="M9 36 A7 7 0 0 1 23 36 Z" fill="#ffd166" stroke="#b9862e" stroke-width="1"/>
  <rect x="7" y="36" width="18" height="3" rx="1.5" fill="#171030" stroke="#b9862e" stroke-width="0.8"/>
  <path d="M16 24.5v3M11 27l1.6 2.3M21 27l-1.6 2.3" stroke="#ffd166" stroke-width="1.4"/>
  <!-- броневые швы -->
  <path d="M27 15v34M43 15.5v33" stroke="#171030" stroke-width="1.2" opacity="0.85"/>
  <path d="M27 22h14M27 42h14" stroke="#6d4fc2" stroke-width="0.8" opacity="0.7"/>
  <!-- выхлоп -->
  <circle cx="10.5" cy="20.5" r="1.7" fill="#171030" stroke="#b9862e" stroke-width="0.8"/>
  <circle cx="10.5" cy="43.5" r="1.7" fill="#171030" stroke="#b9862e" stroke-width="0.8"/>
</svg>
